name: claude-plugins
issue_prefix: CP
url: git@github-newms87:50arms/claude-marketplace.git
runtime: local
language: markdown
framework: none

# No build or lint toolchain — the marketplace ships markdown (skills, rules,
# agent files) plus the danxbot plugin's function hooks. Tests run in the one
# designated Linux container: `npm test` (DX-5648). The "gate" for a change
# reaching consumers is the version bump in <plugin>/.claude-plugin/plugin.json,
# pushed to origin/main by agent-finalize.sh. See workflow.md.
commands:
  test: npm test
  lint: ""
  type_check: ""
  dev: ""

paths:
  source: .
  tests: .

git_mode: main
